name: OpenWrt Build

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      branch:
        description: '源码分支'
        type: choice
        options:
          - openwrt-25.12
          - openwrt-24.10
        default: openwrt-25.12
      use_cache:
        description: '缓存加速'
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.branch || 'openwrt-25.12' }}
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  CCACHE_DIR: /workdir/ccache
  CCACHE_MAXSIZE: 2G

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.branch || 'default' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Show build target
      run: |
        echo "=========================================="
        echo "源码仓库: $REPO_URL"
        echo "源码分支: $REPO_BRANCH"
        echo "配置文件: $CONFIG_FILE"
        echo "缓存启用: ${{ github.event.inputs.use_cache == 'true' }}"
        echo "=========================================="

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl \
          device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool \
          libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
          libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
          ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        echo "CCACHE_DIR=$CCACHE_DIR" >> $GITHUB_ENV
        mkdir -p $CCACHE_DIR

    - name: Check disk space
      run: |
        AVAIL=$(df /workdir --output=avail | tail -1)
        AVAIL_GB=$((AVAIL / 1024 / 1024))
        echo "可用空间: ${AVAIL_GB} GB"
        if [ "$AVAIL_GB" -lt 20 ]; then
          echo "::error::磁盘空间不足 20GB，当前 ${AVAIL_GB}GB"
          exit 1
        fi

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        BRANCH_SUFFIX=$(printf '%s' "$REPO_BRANCH" | sed 's/^openwrt-//' | tr -c 'A-Za-z0-9._-' '_' | sed 's/_*$//')
        echo "分支: $REPO_BRANCH  ->  配置后缀: $BRANCH_SUFFIX"

        if [ -n "$BRANCH_SUFFIX" ] && [ -f ".config.${BRANCH_SUFFIX}" ]; then
          echo "✅ 使用分支专属配置: .config.${BRANCH_SUFFIX}"
          cp ".config.${BRANCH_SUFFIX}" openwrt/.config
        elif [ -f "$CONFIG_FILE" ]; then
          echo "✅ 使用通用配置: $CONFIG_FILE"
          cp "$CONFIG_FILE" openwrt/.config
          if [ "$BRANCH_SUFFIX" != "25.12" ]; then
            echo "::warning::当前分支为 $REPO_BRANCH，使用的却是通用 .config（基于 25.12 编写）"
            echo "::warning::部分软件包可能在该分支不存在，构建可能失败"
            echo "::warning::如需稳定构建，请创建 .config.${BRANCH_SUFFIX} 针对该分支定制"
          fi
        else
          echo "::error::未找到配置文件（既无 .config.${BRANCH_SUFFIX} 也无 $CONFIG_FILE）"
          exit 1
        fi

    - name: Apply custom modifications
      run: |
        cd openwrt
        chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Migrate .config
      run: |
        cd openwrt
        if [ -f .config ]; then
          ./scripts/diffconfig.sh > seed.config
          cp seed.config .config
        fi
        make defconfig

    - name: Restore build cache
      id: cache_restore
      if: github.event.inputs.use_cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          openwrt/dl
          ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-${{ env.REPO_BRANCH }}-${{ hashFiles('diy-part1.sh', 'diy-part2.sh') }}-${{ hashFiles('.config', '.config.24.10') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.REPO_BRANCH }}-

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        echo "--- 下载失败的小文件 ---"
        find dl -size -1024c -exec ls -l {} \; || true
        find dl -size -1024c -exec rm -f {} \; || true

    - name: Save build cache
      if: github.event.inputs.use_cache == 'true' && steps.cache_restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          openwrt/dl
          ${{ env.CCACHE_DIR }}
        key: ${{ steps.cache_restore.outputs.cache-primary-key }}

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        set -o pipefail
        if ! make -j$(nproc) 2>&1 | tee build.log; then
          echo "::warning::并行编译失败，降级单线程重试"
          if ! make -j1 V=s 2>&1 | tee -a build.log; then
            echo "::error::编译失败，输出最后 200 行"
            tail -200 build.log
            if [ -d logs ]; then
              echo "=== logs/ 下的编译日志 ==="
              find logs -type f | head -30
              for f in $(find logs -type f -name "*.txt" | head -5); do
                echo "--------- $f ---------"
                tail -60 "$f"
              done
            fi
            exit 1
          fi
        fi
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.REPO_BRANCH }}
        path: |
          openwrt/build.log
          openwrt/logs/
        retention-days: 3
        if-no-files-found: warn

    - name: Check space usage
      if: always()
      run: df -hT

    - name: Check firmware existence
      id: organize
      if: (env.UPLOAD_FIRMWARE == 'true' || env.UPLOAD_RELEASE == 'true') && !cancelled()
      run: |
        cd openwrt/bin/targets
        FIRMWARE_FILE=$(find . -type f \( -name "*sysupgrade*" -o -name "*factory*" -o -name "*.img" -o -name "*.img.gz" \) -print -quit)
        if [ -n "$FIRMWARE_FILE" ]; then
          FIRMWARE_DIR=$(dirname "$FIRMWARE_FILE")
          echo "✅ 固件目录: $FIRMWARE_DIR"
          echo "FIRMWARE_PATH=openwrt/bin/targets/${FIRMWARE_DIR#./}" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "❌ 未找到任何固件文件"
          echo "status=failure" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Upload firmware directory (Artifact)
      if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-firmware-${{ env.REPO_BRANCH }}${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets/*/*
        retention-days: 3

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=${{ env.REPO_BRANCH }}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        cat > release.txt <<EOF
        Automated build of ImmortalWrt ${{ env.REPO_BRANCH }}
        Source: ${{ env.REPO_URL }}
        Commit: ${{ github.sha }}
        Build date: $(date +"%Y-%m-%d %H:%M:%S %Z")
        Device: ${{ env.DEVICE_NAME }}
        EOF

    - name: Upload firmware to Release
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.release_tag != '' && !cancelled()
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ImmortalWrt ${{ env.REPO_BRANCH }} ${{ env.FILE_DATE }}
        body_path: release.txt
        files: |
          openwrt/bin/targets/*/*/*sysupgrade*
          openwrt/bin/targets/*/*/*factory*
          openwrt/bin/targets/*/*/*.img
          openwrt/bin/targets/*/*/*.img.gz
        draft: false
        prerelease: false

    - name: Delete old workflow runs
      if: always() && github.event_name != 'pull_request'
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
